[package]
name = "ack"
version = "0.1.0"
description = "Signed delivery claims and acknowledgments on Solana"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ack"

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
